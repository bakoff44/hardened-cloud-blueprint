[defaults]
inventory            = inventory/local.ini
roles_path           = roles
interpreter_python   = auto_silent
stdout_callback      = yaml
retry_files_enabled  = False
# host_key_checking reste actif : sur un blueprint de durcissement, accepter
# aveuglement une empreinte inconnue serait contradictoire. Pour le lab local,
# lancez une premiere fois `ssh-keyscan -H 192.168.56.10 >> ~/.ssh/known_hosts`.

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
