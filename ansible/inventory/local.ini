; Lab local — VM definie dans tests/Vagrantfile.
;
; Premier passage, la VM repond encore sur le compte vagrant, port 22 :
;   vagrant up          (depuis tests/)
;   ansible-playbook -i inventory/local.ini ../ansible/site.yml -e @vars/all.yml
;
; Passages suivants, le durcissement est applique : commentez le bloc
; "avant durcissement" et decommentez celui d'apres.

[lab]
local-lab-node ansible_host=192.168.56.10

[lab:vars]
; --- avant durcissement ---
ansible_user=vagrant
ansible_port=22
ansible_ssh_private_key_file=../tests/.vagrant/machines/default/virtualbox/private_key

; --- apres durcissement ---
; ansible_user=deploy
; ansible_port=2222
; ansible_ssh_private_key_file=~/.ssh/id_ed25519
